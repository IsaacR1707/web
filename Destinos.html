  <!-- JS para cinta flotante -->
  <script>
    const cinta = document.querySelector('.cinta-opciones');
    const marcador = document.getElementById('marcador-cinta');
    const espacioCinta = document.getElementById('espacio-cinta');
    let timeoutId;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) {
          clearTimeout(timeoutId);
          cinta.classList.add('fija');
          espacioCinta.style.height = `${cinta.offsetHeight}px`;
        } else {
          timeoutId = setTimeout(() => {
            cinta.classList.remove('fija');
            espacioCinta.style.height = '0px';
          }, 400);
        }
      });
    }, {
      root: null,
      threshold: 1
    });

    observer.observe(marcador);
  </script>
    
    <script>
  const selector = document.getElementById('pasajeros-btn');
  const dropdown = document.querySelector('.pasajeros-dropdown');

  selector.addEventListener('click', () => {
    dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
  });

  document.addEventListener('click', function (e) {
    if (!document.querySelector('.pasajeros-grupo').contains(e.target)) {
      dropdown.style.display = 'none';
    }
  });

  function actualizarContador(tipo, cambio) {
    const elemento = document.getElementById(tipo);
    let valor = parseInt(elemento.textContent);
    valor = Math.max(0, valor + cambio);

    // Limita que siempre haya al menos 1 adulto
    if (tipo === 'adultos' && valor === 0) return;

    elemento.textContent = valor;

    actualizarResumenPasajeros();
  }

  function actualizarResumenPasajeros() {
    const adultos = parseInt(document.getElementById('adultos').textContent);
    const ninos = parseInt(document.getElementById('ninos').textContent);
    const bebes = parseInt(document.getElementById('bebes').textContent);
    const total = adultos + ninos + bebes;

    let label = `${total} pasajero${total > 1 ? 's' : ''}`;
    selector.textContent = label;
  }

  // Inicializa
  actualizarResumenPasajeros();
</script>

<script>
  document.querySelector(".formulario-busqueda").addEventListener("submit", function (e) {
    e.preventDefault(); // Previene envío por defecto del formulario

    const origen = document.getElementById("origen").value;
    const destino = document.getElementById("destino").value;
    const fechaSalida = document.getElementById("fecha_salida").value;
    const adultos = parseInt(document.getElementById("adultos").textContent);
    const ninos = parseInt(document.getElementById("ninos").textContent);
    const bebes = parseInt(document.getElementById("bebes").textContent);
    const totalPasajeros = adultos + ninos + bebes;

    if (!origen || !destino || !fechaSalida) {
      alert("Por favor, completa origen, destino y fecha de salida.");
      return;
    }

    // Guardamos en localStorage
    localStorage.setItem("origen", origen);
    localStorage.setItem("destino", destino);
    localStorage.setItem("fechaSalida", fechaSalida);
    localStorage.setItem("adultos", adultos);
    localStorage.setItem("ninos", ninos);
    localStorage.setItem("bebes", bebes);
    localStorage.setItem("totalPasajeros", totalPasajeros);

    // Ir a página de asientos
    window.location.href = "../paginasterc/Asientos.html";
  });
</script>
